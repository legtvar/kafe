stages:
  - build
  - test
  - deploy

.build-image:
  image: docker:29-cli
  stage: build
  services:
    - name: docker:29-dind-rootless
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Avoid Buildx OCI attestation manifests that GitLab Registry can reject
    # with "blob unknown to registry" during docker push.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "true"
  tags:
    - shared-fi
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker image prune --all --force
  script:
    - docker build --pull --file "$DOCKERFILE" --tag "$IMAGE" .
    - docker push "$IMAGE"
  rules: &image_pipeline_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-api-image:
  extends: .build-image
  variables:
    DOCKERFILE: Api.Dockerfile
    IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_REF_SLUG"

build-web-image:
  extends: .build-image
  variables:
    DOCKERFILE: Web.Dockerfile
    IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG"

build-blender-image:
  extends: .build-image
  variables:
    DOCKERFILE: Blender.Dockerfile
    IMAGE: "$CI_REGISTRY_IMAGE/blender:$CI_COMMIT_REF_SLUG"

test-api:
  image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
  stage: test
  variables:
    POSTGRES_DB: kafe
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
  services:
    - postgres
  tags:
    - shared-fi
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    when: always
    expire_in: 42 s
    paths:
      - ./**/*test-result.xml
    reports:
      junit:
        - ./**/*test-result.xml
  script:
    - apk update && apk add ffmpeg jq moreutils
    - jq
      --arg postgres "host=postgres;database=postgres;password=postgres;username=postgres;Include Error Detail=true"
      --arg kafe "host=postgres;database=kafe;password=postgres;username=postgres;Include Error Detail=true"
      '.ConnectionStrings.postgres=$postgres | .ConnectionStrings.KAFE=$kafe'
      ./Api/appsettings.local.json | sponge ./Api/appsettings.local.json
    - dotnet test Tests
      --logger:"junit;LogFilePath=./artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"

deploy-production:
  stage: deploy
  variables:
    REBUILD_PROJECTIONS: true
  script:
    - cp "$APPSETTINGS_PRODUCTION" "./Api/appsettings.local.json"
    - docker compose -f docker-compose.base.yml -f docker-compose.production.yml build
    - docker compose -f docker-compose.base.yml -f docker-compose.production.yml down
    - docker compose -f docker-compose.base.yml -f docker-compose.production.yml up -d
  tags:
    - mlejnek
  resource_group: mlejnek
  environment:
    name: production
    url: https://kafe.fi.muni.cz
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true

deploy-staging:
  stage: deploy
  variables:
    CI: false
    REBUILD_PROJECTIONS: true
  script:
    - cp "$APPSETTINGS_STAGE" "./Api/appsettings.local.json"
    - docker compose -f docker-compose.base.yml -f docker-compose.staging.yml build
    - docker compose -f docker-compose.base.yml -f docker-compose.staging.yml down
    - docker compose -f docker-compose.base.yml -f docker-compose.staging.yml up -d
  tags:
    - mlejnek
  resource_group: mlejnek
  environment:
    name: staging
    url: https://kafe-stage.fi.muni.cz
  when: manual
  allow_failure: true

deploy-docs:
  stage: deploy
  script:
    - docker compose -f docker-compose.docs.yml build
    - docker compose -f docker-compose.docs.yml down
    - docker compose -f docker-compose.docs.yml up -d 
  tags:
    - mlejnek
  environment:
    name: docs
    url: https://kafe.fi.muni.cz/docs
  when: manual
  needs: []
  allow_failure: true
  
deploy-nuget:
  stage: deploy
  script:
    - dotnet pack .\Kafe.sln -c Release -o artifacts -p ContinuousIntegrationBuild=true
    - dotnet nuget enable source KAFE
    - dotnet nuget update source KAFE
      --source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json"
      --username gitlab-ci-token
      --password $CI_JOB_TOKEN
      --store-password-in-clear-text
    - dotnet nuget push "artifacts/*.nupkg" --source KAFE
  when: manual
  needs: []
  allow_failure: true

include:
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

dependency-scanning:
  tags:
    - shared-fi
  artifacts:
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

dependency-scanning-third-party:
  image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
  stage: test
  needs: []
  tags:
    - shared-fi
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
    TRIVY_VERSION: "0.76.2"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivy-cache
  cache:
    key: dependency-scanning-third-party
    paths:
      - .nuget/
      - .trivy-cache/
  before_script:
    - apk update && apk add --no-cache build-base ca-certificates curl jq ruby ruby-dev
    - >
      curl -fsSL
      "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      -o /tmp/trivy.tar.gz
    - tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
    - gem install gitlab-security_report_schemas --version "0.2.1.min15.0.0.max15.2.4" --no-document
  script:
    - export SCAN_START_TIME=$(date -u +%Y-%m-%dT%H:%M:%S)
    - dotnet restore Kafe.sln --locked-mode
    - >
      dotnet list Kafe.sln package --vulnerable --include-transitive
      --format json > nuget-audit.json
    - >
      /tmp/trivy fs --scanners vuln --include-dev-deps --exit-code 0
      --format json --output trivy-dependencies.json
      --skip-dirs ".git,artifacts,**/node_modules,**/bin,**/obj"
      "$CI_PROJECT_DIR"
    - export SCAN_END_TIME=$(date -u +%Y-%m-%dT%H:%M:%S)
    - >
      jq -n --slurpfile nuget nuget-audit.json
      --slurpfile trivy trivy-dependencies.json
      --arg project_dir "$CI_PROJECT_DIR"
      --arg trivy_version "$TRIVY_VERSION"
      --arg start_time "$SCAN_START_TIME"
      --arg end_time "$SCAN_END_TIME"
      -f Scripts/security/convert_dependency_reports.jq
      > gl-dependency-scanning-report.json
    - jq -e '(.vulnerabilities | map(.id) | unique | length) == (.vulnerabilities | length)' gl-dependency-scanning-report.json
    - security-report-schemas gl-dependency-scanning-report.json --report_type=dependency_scanning
    - jq -r '"Generated \(.vulnerabilities | length) unique dependency vulnerability findings."' gl-dependency-scanning-report.json
  artifacts:
    expire_in: 1 week
    paths:
      - nuget-audit.json
      - trivy-dependencies.json
      - gl-dependency-scanning-report.json
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  rules: *image_pipeline_rules

# The specific image-scanning jobs below replace the template's single automatically-targeted scan.
container_scanning:
  rules:
    - when: never

.container-scanning-image:
  extends: container_scanning
  tags:
    - shared-fi
  artifacts:
    expire_in: 1 week
  rules: *image_pipeline_rules

container_scanning_api:
  extends: .container-scanning-image
  needs:
    - job: build-api-image
      artifacts: false
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_REF_SLUG"

container_scanning_web:
  extends: .container-scanning-image
  needs:
    - job: build-web-image
      artifacts: false
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_SLUG"

container_scanning_blender:
  extends: .container-scanning-image
  needs:
    - job: build-blender-image
      artifacts: false
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/blender:$CI_COMMIT_REF_SLUG"

container_scanning_postgres:
  extends: .container-scanning-image
  needs: []
  variables:
    CS_IMAGE: "postgres:17-alpine"

include:
  - local: ./Tests/EndToEnd/.gitlab-ci.yml
