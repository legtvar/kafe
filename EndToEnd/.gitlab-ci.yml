# Include from the root CI configuration:
# include:
#   - local: EndToEnd/.gitlab-ci.yml

test-e2e:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  stage: test
  services:
    - name: docker:29-dind-rootless
      alias: docker
      command: ["--tls=false"]
  variables:
    KAFE_E2E: "1"
    KAFE_E2E_HOST: docker
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - dotnet restore EndToEnd/Kafe.EndToEnd.csproj
    - dotnet build EndToEnd/Kafe.EndToEnd.csproj --no-restore
    - dotnet test EndToEnd/Kafe.EndToEnd.csproj --no-build --logger "junit;LogFilePath=EndToEnd/artifacts/film-upload-e2e-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  tags:
    - shared-fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - EndToEnd/artifacts/
    reports:
      junit: EndToEnd/artifacts/film-upload-e2e-test-result.xml
