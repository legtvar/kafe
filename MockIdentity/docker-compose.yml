services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1
    ports:
      - "44370:8080"
    volumes:
      - ./config.json:/tmp/config.json:ro
    environment:
      JSON_CONFIG_PATH: /tmp/config.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/isalive"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 5s
