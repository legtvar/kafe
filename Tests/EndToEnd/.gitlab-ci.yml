# Include from the root CI configuration:
# include:
#   - local: Tests/EndToEnd/.gitlab-ci.yml

test-e2e:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  stage: test
  services:
    - name: docker:29-dind
  variables:
    KAFE_E2E: "1"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  script:
    - dotnet restore Tests/Kafe.Tests.csproj
    - dotnet build Tests/Kafe.Tests.csproj --no-restore
    - Tests/bin/Debug/net9.0/.playwright/node/linux-x64/node Tests/bin/Debug/net9.0/.playwright/package/cli.js install --with-deps --no-shell chromium
    - dotnet test Tests/Kafe.Tests.csproj --no-build --filter FullyQualifiedName~Kafe.Tests.EndToEnd --logger "junit;LogFilePath=Tests/EndToEnd/artifacts/film-upload-e2e-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  tags:
    - shared-fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - Tests/EndToEnd/artifacts/
    reports:
      junit: Tests/EndToEnd/artifacts/film-upload-e2e-test-result.xml
